<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200" fill="none">
  <defs>
    <filter id="bldgShadowDark" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.45" />
    </filter>
    <linearGradient id="groundDark" x1="0" y1="0" x2="640" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f1724" />
      <stop offset="100%" stop-color="#0c131e" />
    </linearGradient>
    <radialGradient id="quadDark" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#166534" stop-opacity="0.48" />
      <stop offset="100%" stop-color="#14532d" stop-opacity="0.25" />
    </radialGradient>
  </defs>

  <!-- Map canvas -->
  <rect width="640" height="200" fill="url(#groundDark)" />

  <!-- Subtle architectural grid lines -->
  <g stroke="#bfd5e2" stroke-opacity="0.045" stroke-width="1">
    <path d="M0 50 H640 M0 100 H640 M0 150 H640" />
    <path d="M100 0 V200 M200 0 V200 M300 0 V200 M400 0 V200 M500 0 V200 M600 0 V200" />
  </g>

  <!-- Campus greenspaces -->
  <path d="M0 32 Q115 24 162 84 Q180 132 142 192 L0 192 Z" fill="#14532d" fill-opacity="0.28" />
  <path d="M556 34 L640 34 L640 192 L556 192 Z" fill="#14532d" fill-opacity="0.22" />
  <!-- Polonsky Commons central oval quad -->
  <ellipse cx="352" cy="105" rx="88" ry="42" fill="url(#quadDark)" stroke="#4cc38a" stroke-opacity="0.28" stroke-width="1.2" />

  <!-- Tree canopies -->
  <g fill="#4cc38a" fill-opacity="0.14">
    <circle cx="52" cy="72" r="14" />
    <circle cx="74" cy="86" r="11" />
    <circle cx="44" cy="144" r="15" />
    <circle cx="88" cy="158" r="12" />
    <circle cx="318" cy="104" r="9" />
    <circle cx="388" cy="100" r="10" />
    <circle cx="596" cy="56" r="13" />
    <circle cx="612" cy="154" r="14" />
  </g>

  <!-- Road outer casings -->
  <g stroke="#293b54" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M0 28 H640" stroke-width="14" />
    <path d="M538 0 V200" stroke-width="16" />
    <path d="M538 50 L372 50 C248 50 186 72 186 112 C186 150 248 172 372 172 L538 172" stroke-width="11" />
    <path d="M186 112 H0" stroke-width="9" />
  </g>

  <!-- Road surfaces -->
  <g stroke="#1b283b" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M0 28 H640" stroke-width="11" />
    <path d="M538 0 V200" stroke-width="13" />
    <path d="M538 50 L372 50 C248 50 186 72 186 112 C186 150 248 172 372 172 L538 172" stroke-width="8.5" />
    <path d="M186 112 H0" stroke-width="6.5" />
  </g>

  <!-- Pedestrian pathways across Polonsky Commons -->
  <g stroke="#789ab0" stroke-opacity="0.38" stroke-width="2" stroke-dasharray="4 4" fill="none" stroke-linecap="round">
    <path d="M276 76 Q352 106 426 84" />
    <path d="M282 134 Q354 106 432 130" />
    <path d="M352 62 V146" />
    <path d="M262 105 H442" />
  </g>

  <!-- Road labels -->
  <g fill="#789ab0" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="600" letter-spacing="0.06em">
    <text x="108" y="31">CONLIN RD W</text>
    <text x="535" y="128" transform="rotate(-90 535 128)" text-anchor="middle">SIMCOE ST N</text>
  </g>

  <!-- Building footprints -->
  <g filter="url(#bldgShadowDark)">
    <!-- SIR -->
    <rect x="96" y="56" width="66" height="36" rx="6" fill="#1a2638" stroke="#334863" stroke-width="1.4" />
    <!-- SCI -->
    <path d="M222 58 H292 V90 H252 V82 H222 Z" fill="#132f2a" stroke="#36996d" stroke-width="1.5" />
    <!-- ERC -->
    <rect x="308" y="57" width="76" height="30" rx="6" fill="#1a2638" stroke="#334863" stroke-width="1.4" />
    <!-- SHA -->
    <path d="M402 58 H488 V90 H414 V82 H402 Z" fill="#132f2a" stroke="#36996d" stroke-width="1.5" />
    <!-- BIT -->
    <rect x="224" y="120" width="80" height="34" rx="6" fill="#1a2638" stroke="#334863" stroke-width="1.4" />
    <!-- LIB -->
    <rect x="322" y="118" width="72" height="38" rx="9" fill="#132f2a" stroke="#36996d" stroke-width="1.6" />
    <!-- ENG -->
    <rect x="412" y="118" width="78" height="36" rx="6" fill="#1a2638" stroke="#334863" stroke-width="1.4" />
    <!-- U5 -->
    <rect x="562" y="68" width="46" height="54" rx="6" fill="#1a2638" stroke="#2c3f57" stroke-width="1.3" />
  </g>

  <!-- Building code labels -->
  <g fill="#bfd5e2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="700" text-anchor="middle">
    <text x="129" y="78">SIR</text>
    <text x="257" y="76" fill="#4cc38a">SCI</text>
    <text x="346" y="76">ERC</text>
    <text x="446" y="77" fill="#4cc38a">SHA</text>
    <text x="264" y="141">BIT</text>
    <text x="358" y="141" fill="#4cc38a">LIB</text>
    <text x="451" y="140">ENG</text>
    <text x="585" y="99" font-size="10.5" fill="#8ca6b8">U5</text>
  </g>

  <!-- Live availability glowing pins -->
  <g>
    <circle cx="286" cy="64" r="8.5" fill="#4cc38a" fill-opacity="0.22" />
    <circle cx="286" cy="64" r="3.8" fill="#4cc38a" stroke="#0f1724" stroke-width="1.4" />

    <circle cx="480" cy="65" r="8.5" fill="#4cc38a" fill-opacity="0.22" />
    <circle cx="480" cy="65" r="3.8" fill="#4cc38a" stroke="#0f1724" stroke-width="1.4" />

    <circle cx="386" cy="124" r="9.5" fill="#4cc38a" fill-opacity="0.25" />
    <circle cx="386" cy="124" r="4.2" fill="#4cc38a" stroke="#0f1724" stroke-width="1.4" />

    <circle cx="482" cy="126" r="7.5" fill="#11c8d8" fill-opacity="0.22" />
    <circle cx="482" cy="126" r="3.4" fill="#11c8d8" stroke="#0f1724" stroke-width="1.3" />
  </g>
</svg>
