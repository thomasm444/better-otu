<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <defs>
    <clipPath id="u-cavity-light">
      <path d="M 61 64 H 173 V 162 A 56 56 0 0 1 61 162 Z" />
    </clipPath>
    <clipPath id="top-bar-light">
      <rect x="39" y="42" width="92" height="22" />
    </clipPath>
    <clipPath id="right-stem-top-light">
      <rect x="173" y="107" width="22" height="37" />
    </clipPath>
  </defs>

  <!-- Inner steel-teal arch -->
  <g clip-path="url(#u-cavity-light)">
    <path
      d="M 55 107 A 102 102 0 0 1 157 209 L 157 232"
      stroke="#7C9BA0"
      stroke-width="22"
      stroke-linecap="butt"
      fill="none"
    />
  </g>

  <!-- Teal bevel under the curved right tip of the top bar -->
  <g clip-path="url(#top-bar-light)">
    <rect x="94" y="42" width="37" height="22" fill="#187F9E" />
    <path
      d="M 39 42 H 131 Q 112 64 88 64 H 39 Z"
      fill="#1F2545"
    />
  </g>

  <!-- Teal bevel at the top-left tip of the right stem -->
  <g clip-path="url(#right-stem-top-light)">
    <rect x="173" y="107" width="22" height="37" fill="#187F9E" />
    <path
      d="M 195 107 V 144 H 173 V 134 Q 173 116 195 107 Z"
      fill="#1F2545"
    />
  </g>

  <!-- Main deep navy U body -->
  <path
    d="M 39 42 H 61 V 162 A 56 56 0 0 0 173 162 V 133 H 195 V 162 A 78 78 0 0 1 39 162 Z"
    fill="#1F2545"
  />

  <!-- Teal "+" mark -->
  <rect x="173" y="17" width="22" height="72" fill="#187F9E" />
  <rect x="148" y="42" width="72" height="22" fill="#187F9E" />
</svg>
